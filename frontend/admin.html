<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | CivicConnect</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1; /* Indigo */
            --secondary: #a855f7; /* Purple */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --pending: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* Premium Header */
        .admin-header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(15px);
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .admin-header h2 {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
        }

        /* Main Container */
        .admin-container {
            max-width: 1400px;
            margin: 2.5rem auto;
            padding: 0 24px;
        }

        /* Management Card */
        .admin-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .admin-card h3 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 2rem;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-card h3 i {
            color: var(--primary);
        }

        /* Table Design */
        .table-responsive {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .admin-table th {
            background: #f8fafc;
            padding: 18px;
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: var(--text-muted);
            border-bottom: 2px solid #e2e8f0;
        }

        .admin-table td {
            padding: 18px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
            color: var(--text-dark);
            vertical-align: middle;
        }

        .admin-table tr:hover {
            background-color: #fcfdff;
        }

        /* Status & Actions */
        .status-badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-pending { background: #fff7ed; color: #c2410c; }
        .status-resolved { background: #f0fdf4; color: #15803d; }

        /* Modern Select Dropdown in Table */
        .status-select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        .status-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* Description column truncation */
        .desc-cell {
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-muted);
        }
 .back-video {
    position: fixed;
    top: 0;
    left: 0;
    min-width: 100%;
    min-height: 100%;
    object-fit: cover;
    z-index: -2;
}
    </style>
</head>

<body onload="checkAdminAccess(); loadAllComplaints();">
<video class="back-video" autoplay muted loop playsinline>
    <source src="https://ik.imagekit.io/oq9dfnayf/video.mp4" type="video/mp4">
</video>
<header class="admin-header">
    <h2><i class="fas fa-shield-halved"></i>Municipality System</h2>
    <button onclick="logoutUser()" class="logout-btn">
        <i class="fas fa-power-off"></i> Logout
    </button>
</header>

<div class="admin-container">
    <div class="admin-card">
        <h3><i class="fas fa-list-check"></i> Complaint Management</h3>

        <div class="table-responsive">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Citizen Name</th>
                        <th>Issue Category</th>
                        <th>Description</th>
                        <th>Current Status</th>
                        <th>Update Action</th>
                    </tr>
                </thead>
                <tbody id="adminTable">
                    <tr>
                        <td><strong>John Doe</strong></td>
                        <td>Water Supply</td>
                        <td><div class="desc-cell">Main pipe burst near 5th Avenue causing local flooding...</div></td>
                        <td><span class="status-badge status-pending">Pending</span></td>
                        <td>
                            <select class="status-select" onchange="updateStatus(this)">
                                <option value="Pending">Pending</option>
                                <option value="Resolved">Resolved</option>
                            </select>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>

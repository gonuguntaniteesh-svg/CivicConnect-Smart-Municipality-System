<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicConnect | User Portal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1; /* Indigo */
            --secondary: #a855f7; /* Purple */
            --accent: #06b6d4; /* Cyan */
            --success: #22c55e;
            --warning: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #f5f7ff 0%, #e0e7ff 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-dark: #1e1b4b;
            --text-muted: #475569;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
        }

        /* Top-Class Header */
        .dashboard-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 1.2rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .dashboard-header h2 {
            font-size: 1.4rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logout-btn {
            background: #fff;
            color: #ef4444;
            border: 1px solid #fee2e2;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.2);
        }

        /* Layout Container */
        .dashboard-container {
            max-width: 1300px;
            margin: 3rem auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            gap: 2.5rem;
        }

        @media (max-width: 1024px) {
            .dashboard-container { grid-template-columns: 1fr; }
        }

        /* Colorful Cards */
        .dashboard-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
        }

        .dashboard-card h3 {
            margin-bottom: 2rem;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dashboard-card h3::before {
            content: '';
            width: 6px;
            height: 24px;
            background: var(--secondary);
            border-radius: 10px;
        }

        /* Form Styling */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
            margin-bottom: 1.2rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #eef2ff;
            border-radius: 14px;
            background: #f8faff;
            font-size: 0.95rem;
            color: var(--text-dark);
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .primary-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.4);
            filter: brightness(1.1);
        }

        /* Vibrant Table */
        .table-wrapper {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #eef2ff;
        }

        .modern-table {
            width: 100%;
            border-collapse: collapse;
        }

        .modern-table th {
            text-align: left;
            padding: 18px;
            background: #fcfdff;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            border-bottom: 1px solid #eef2ff;
        }

        .modern-table td {
            padding: 20px 18px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .modern-table tr:hover {
            background-color: #f9fafb;
        }

        /* Status Badges */
        .status-pill {
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-pending { background: #fff7ed; color: #c2410c; }
        .status-resolved { background: #f0fdf4; color: #15803d; }
        .back-video {
    position: fixed;
    top: 0;
    left: 0;
    min-width: 100%;
    min-height: 100%;
    object-fit: cover;
    z-index: -2;
}

    </style>
</head>

<body class="dashboard-body" onload="checkUserAccess(); loadUserComplaints();">
<video class="back-video" autoplay muted loop playsinline>
    <source src="https://ik.imagekit.io/oq9dfnayf/video.mp4" type="video/mp4">
</video>

<header class="dashboard-header">
    <h2><i class="fas fa-city"></i>Municipality System</h2>
    <button class="logout-btn" onclick="logoutUser()">
        <i class="fas fa-power-off"></i> Logout
    </button>
</header>

<div class="dashboard-container">

    <div class="dashboard-card">
        <h3>Submit Report</h3>
        <div class="form-grid">
            <input type="text" id="name" placeholder="Full Name">
            <input type="email" id="userEmail" placeholder="Email Address">
        </div>

        <select id="problemType">
            <option value="" disabled selected>Select Problem Type</option>
            <option>Water Supply Issue</option>
            <option>Street Light Repair</option>
            <option>Garbage Collection</option>
            <option>Drainage Blockage</option>
            <option>Road Damage</option>
        </select>

        <textarea id="description" placeholder="Describe the problem here..."></textarea>

        <button class="primary-btn" onclick="submitComplaint()">
            Post Complaint <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <div class="dashboard-card">
        <h3>Live Tracking</h3>
        <div class="table-wrapper">
            <table class="modern-table">
                <thead>
                    <tr>
                        <th>Reporter</th>
                        <th>Problem</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="complaintTable">
                    <tr>
                        <td>John Doe</td>
                        <td>Water Leakage</td>
                        <td><span class="status-pill status-pending"><i class="fas fa-clock"></i> Pending</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
